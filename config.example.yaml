# vigilo daemon configuration

# Paths to watch for sensitive file access.
watch_paths:
  - $HOME/.ethereum
  - $HOME/.bitcoin
  - /etc/vigilo/keys
  - /run/secrets
  - /app/.env
  - /app/keystore

# Paths to never watch (test fixtures, package caches, etc.)
exclude_paths:
  - $HOME/.npm
  - $HOME/.cache
  - /tmp

# How often to poll /proc and network state
poll_interval: 5s

# Keep events in SQLite for this many hours (auto-purge after)
buffer_retention_hours: 24

# MCP server transport: "stdio" (default) or "http"
mcp_transport: stdio

# Only used when mcp_transport = "http"
# mcp_addr: ":7070"

# How long before the same LLM-generated signal can re-alert
signal_cooldown: 1h

# ── Immediate alerter ─────────────────────────────────────────────────────────
# Fires within seconds of detection — no LLM, pure rule-based.
# The LLM analyst agent still runs on its own schedule for pattern correlation.
alerter:
  # Minimum severity to trigger immediate alerts: "high" or "critical"
  min_severity: high

  # Slack incoming webhook (no bot token needed)
  # Create at: Slack app → Features → Incoming Webhooks → Add New Webhook
  slack:
    webhook_url: https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXX

  # Telegram bot — instant mobile push, great for crypto ops teams
  # 1. Create bot: https://t.me/BotFather → /newbot
  # 2. Get chat ID: add @userinfobot to your group, it replies with the ID
  telegram:
    bot_token: "123456789:ABCdefGHIjklMNOpqrSTUvwxYZ"
    chat_id: "-100123456789"

  # Email via SMTP (Gmail, SendGrid, Mailgun, AWS SES)
  # For Gmail: use an App Password, not your account password
  # email:
  #   smtp_host: smtp.gmail.com
  #   smtp_port: 587
  #   username: alerts@yourcompany.com
  #   password: your-app-password
  #   from: alerts@yourcompany.com
  #   to:
  #     - oncall@yourcompany.com
  #     - cto@yourcompany.com

  # Generic webhooks — PagerDuty, OpsGenie, custom SIEM, etc.
  # webhooks:
  #   - name: pagerduty
  #     url: https://events.pagerduty.com/v2/enqueue
  #     headers:
  #       Authorization: Token token=your-pagerduty-token
  #   - name: internal-siem
  #     url: https://siem.internal/api/events

# ── auditd integration (Linux only) ──────────────────────────────────────────
# Tails /var/log/audit/audit.log for kernel-level syscall events.
# Richer than /proc polling — captures every file-open, exec, delete, rename.
# Requires: vigilo user in the adm group (or run as root).
# Only processes events matching audit rules with a "vigilo_" key prefix.
#
# Set up audit rules (run as root):
#   auditctl -w /app/keystore -p rwa -k vigilo_keystore
#   auditctl -w /run/secrets  -p rwa -k vigilo_secrets
#   auditctl -w /app/.env     -p wa  -k vigilo_env
#
# auditd_log_path: /var/log/audit/audit.log

# ── Suppression rules ─────────────────────────────────────────────────────────
# Events matching any rule are dropped before reaching the buffer.
suppress_rules:
  - match: /var/backups/
    source: file_access
    reason: "nightly backup job reads credential dirs"

  - match: datadog-agent
    source: process
    reason: "observability agent — known safe"

  - match: /etc/vigilo/
    source: file_access
    reason: "vigilo reads its own config on reload"
