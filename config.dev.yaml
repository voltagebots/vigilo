# vigilo dev config — for local testing and Claude Desktop MCP integration
# Usage: vigilo --config config.dev.yaml --db /tmp/vigilo-dev.db

watch_paths:
  - ~/.ssh
  - ~/.ethereum
  - ~/.bitcoin
  - ~/.aws/credentials
  - ~/.gnupg

exclude_paths:
  - ~/.npm
  - ~/.cache
  - /tmp

poll_interval: 5s
buffer_retention_hours: 24

# stdio = Claude Desktop spawns vigilo and talks over stdin/stdout
mcp_transport: stdio

signal_cooldown: 5m

# No immediate alerter in dev — Claude Desktop is the analyst
alerter:
  min_severity: critical

# Supply-chain guard — scans local source checkouts for tampered manifests.
# Point `roots` at where you actually keep source; there is no implicit default.
supply_chain_guard:
  enabled: true
  scan_interval: 5m
  roots:
    - ~/src

# IOC matching. include_known_c2 stays off here: this machine may well be the
# one running vigilo's own Telegram alerter, which would self-alert.
ioc:
  include_known_c2: false
